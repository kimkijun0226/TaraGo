services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: tarago
      POSTGRES_USER: tarago
      POSTGRES_PASSWORD: tarago
    ports:
      - "5432:5432"
    volumes:
      - tarago-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarago -d tarago"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tarago-postgres:
